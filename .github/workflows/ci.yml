name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every library file is gated behind Go's experimental simd package
# (`//go:build goexperiment.simd`), so the experiment must be exported for
# build, vet and test. Only the generators and `internal/simdcheck` are
# untagged.
env:
  GOEXPERIMENT: simd

jobs:
  build:
    name: fmt, vet, test, stock and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: go version
        run: go version

      # Fails on any unformatted file (gofmt -l .).
      - name: make check
        run: make check

      # vet + test + test -race + GODEBUG=simd=0 go test.
      - name: make all
        run: make all

      # The stock-toolchain contract: the generators build and test without the
      # experiment, and the module as a whole fails loudly (internal/simdcheck)
      # instead of silently skipping the gated packages.
      - name: make stock
        run: make stock

      - name: make build
        run: make build
